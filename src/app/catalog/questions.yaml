# Hand-authored mapping of the 66 workbook questions → controls and required slots.
# answer_type: yes_no | text | dropdown | attach | list
# slots: attribute → short description; the planner asks only for empty/conflicted slots.
# The question text, criticality, scores and assessor rules come from buyer_rules.yaml (generated).
