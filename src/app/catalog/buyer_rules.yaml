questions:
  '1':
    qid: '1'
    topic: Governance
    text: Does your organization have a formal Information Security Program established?
    rule: "If answer is \"Yes\":\nSelf attestation is sufficient.\n\nIf answer is \"No\":\n-Require justification with submission\
      \ of org chart and identification of who oversees InfoSec governance and roles involved on InfoSec team.\n-Require timeline\
      \ for implementation if vendor conveys that formalization is in process.\n\nIf vendor cannot provide any of the above\
      \ remediation evidence: \n-Escalate to TPRM Program Manager for risk acceptance, alternate controls/remediation plans\
      \ or rejection directive."
    control_id: GOV-01
    control_objective: The organization facilitates the implementation of cybersecurity & data protection governance controls
    criticality: Critical
    informational: false
    escalate_if_no: true
    inherent_pts: 6.0
    residual_pts: 1.0
  '2':
    qid: '2'
    topic: Governance
    text: Does your organization have a published set of Information Security policies, standards and procedures?
    rule: 'If answer is "Yes":

      Self attestation is sufficient.


      If answer is "No":

      -Escalate to TPRM Program Manager for risk acceptance, alternate controls/remediation plans or rejection directive.'
    control_id: GOV-02
